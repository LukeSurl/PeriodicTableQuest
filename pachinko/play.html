<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003C3B">
<title>Pachinko</title>
<script>/* Always fetch the latest version of these files, so an update shows at once */ window.GQ_V = Date.now(); document.write(['../css/style.css', '../grid/css/grid.css', 'css/pachinko.css'].map(f => `<link rel="stylesheet" href="${f}?v=${GQ_V}">`).join(''));</script>
</head>
<body class="play">
<div class="teambar" id="bar"><span class="you" id="you">Joining…</span><span class="clock" id="clock"></span></div>

<form class="joinform hidden" id="joinform">
  <h2 id="jtitle">Pachinko</h2>
  <p>Enter the code shown on the screen</p>
  <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" required aria-label="Game code">
  <p><button class="btn primary" style="font-size:1.1rem;padding:.6rem 1.4rem">Join</button></p>
</form>

<div class="wrap hidden" id="game">
  <div class="mini">
    <div class="s a"><span id="nameA"></span><span id="scoreA">0</span></div>
    <div class="s b"><span id="nameB"></span><span id="scoreB">0</span></div>
  </div>
  <div class="status hidden" id="status"></div>
  <button class="btn primary bigask" id="ask" disabled>Get a question</button>
  <p class="progress" id="progress"></p>
  <div class="done hidden" id="done"></div>
  <ul class="myballs" id="myballs" aria-label="Your balls"></ul>
  <p class="hint">Tap for a question. Get it right and a ball in your team's colour drops down the board on the big screen. It scores the points of the zone it lands in.</p>
</div>

<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="cooldown hidden" id="cool"></div>

<script>/* Always fetch the latest version of these files, so an update shows at once */ document.write(['../js/config.js', '../grid/js/settings.js', '../grid/js/common.js', '../grid/js/backend.js', 'js/pachinko.js', 'js/play.js'].map(f => `<script src="${f}?v=${GQ_V}"><\/script>`).join(''));</script>
</body>
</html>
