<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003C3B">
<title>Periodic Table Quest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="play">
<div class="teambar" id="bar"><span class="you" id="you">Joining…</span><span class="clock" id="clock"></span></div>

<form class="joinform hidden" id="joinform">
  <h2 id="jtitle">Periodic Table Quest</h2>
  <p>Enter the code shown on the screen</p>
  <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" required>
  <p><button class="btn primary" style="font-size:1.1rem;padding:.6rem 1.4rem">Join</button></p>
</form>

<div class="wrap hidden" id="game">
  <div class="mini">
    <div class="s a"><span id="nameA"></span><span id="scoreA">0</span></div>
    <div class="s b"><span id="nameB"></span><span id="scoreB">0</span></div>
  </div>
  <div class="status hidden" id="status"></div>
  <div class="scroller"><div id="table"></div></div>
  <div class="actions">
    <button class="btn primary" id="rndFree">Random free element</button>
    <button class="btn" id="rndSteal">Random steal</button>
  </div>
  <p class="hint" id="hint">Tap an element and answer its question correctly to claim it for your team. Swipe sideways to see the whole table, or turn your phone sideways.</p>
  <p class="hint" id="mine"></p>
</div>

<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="cooldown hidden" id="cool"></div>

<script src="js/config.js"></script>
<script src="js/elements.js"></script>
<script src="js/questions.js"></script>
<script src="js/quiz.js"></script>
<script src="js/table.js"></script>
<script src="js/backend.js"></script>
<script src="js/play.js"></script>
</body>
</html>
