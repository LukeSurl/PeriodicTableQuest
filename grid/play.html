<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003C3B">
<title>Quiz Grid</title>
<script>/* Always fetch the latest version of these files, so an update shows at once */ window.GQ_V = Date.now(); document.write(['../css/style.css', 'css/grid.css'].map(f => /\.css$/.test(f) ? `<link rel="stylesheet" href="${f}?v=${GQ_V}">` : `<script src="${f}?v=${GQ_V}"><\/script>`).join(''));</script>
</head>
<body class="play">
<div class="teambar" id="bar"><span class="you" id="you">Joining…</span><span class="clock" id="clock"></span></div>

<form class="joinform hidden" id="joinform">
  <h2 id="jtitle">Quiz Grid</h2>
  <p>Enter the code shown on the screen</p>
  <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" required aria-label="Game code">
  <p><button class="btn primary" style="font-size:1.1rem;padding:.6rem 1.4rem">Join</button></p>
</form>

<div class="wrap hidden" id="game">
  <div class="mini">
    <div class="s a"><span id="nameA"></span><span><small>won</small> <span id="scoreA">0</span></span></div>
    <div class="s b"><span id="nameB"></span><span><small>won</small> <span id="scoreB">0</span></span></div>
  </div>
  <div class="status hidden" id="status"></div>
  <div id="grid"></div>
  <p class="hint" id="hint">Tap a question and answer it. The team with the most correct answers on a question holds it, and the team holding most questions at the end wins the game.</p>
</div>

<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="cooldown hidden" id="cool"></div>

<script>/* Always fetch the latest version of these files, so an update shows at once */ window.GQ_V = Date.now(); document.write(['../js/config.js', 'js/settings.js', 'js/common.js', 'js/backend.js', 'js/play.js'].map(f => /\.css$/.test(f) ? `<link rel="stylesheet" href="${f}?v=${GQ_V}">` : `<script src="${f}?v=${GQ_V}"><\/script>`).join(''));</script>
</body>
</html>
