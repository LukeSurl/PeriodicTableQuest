<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Grid</title>
<script>/* Always fetch the latest version of these files, so an update shows at once */ window.GQ_V = Date.now(); document.write(['../css/style.css', 'css/grid.css'].map(f => /\.css$/.test(f) ? `<link rel="stylesheet" href="${f}?v=${GQ_V}">` : `<script src="${f}?v=${GQ_V}"><\/script>`).join(''));</script>
</head>
<body class="host">
<header>
  <h1 id="title">Quiz Grid</h1>
  <span class="topic" id="topic"></span>
  <span class="mode" id="mode"></span>
</header>
<main>
  <section class="board">
    <div class="gboard" id="grid"></div>
    <div class="overlay hidden" id="overlay"><div class="box" id="overlayBox"></div></div>
  </section>
  <aside class="side">
    <div class="card qr">
      <div class="code" id="qr"></div>
      <div class="join" id="join"></div>
    </div>
    <div class="card timer">
      <div class="t" id="clock">–:––</div>
      <div class="lbl" id="clockLbl">Waiting to start</div>
    </div>
    <div>
      <div class="scorecap" id="scorecap">Questions won</div>
      <div class="scores">
        <div class="score a"><div class="nm" id="nameA"></div><div class="n" id="scoreA">0</div><div class="pl" id="plA">0 players</div></div>
        <div class="score b"><div class="nm" id="nameB"></div><div class="n" id="scoreB">0</div><div class="pl" id="plB">0 players</div></div>
      </div>
    </div>
    <div class="card howto" id="howto"></div>
    <div class="card feed"><ul id="feed"></ul></div>
  </aside>
</main>
<div class="controls" id="controls">
  <label>Minutes <input type="number" id="mins" min="1" max="60" step="1"></label>
  <label>or ends at <input type="time" id="endAt" style="width:7em"></label>
  <button class="btn primary" id="start">Start</button>
  <button class="btn" id="plus">+1 min</button>
  <button class="btn" id="end">End now</button>
  <button class="btn warn" id="reset">Clear scores</button>
  <button class="btn warn" id="newgame">New game</button>
  <span class="spacer"></span>
  <a class="btn hidden" id="testphone" target="_blank" rel="noopener">Open a test phone</a>
  <button class="btn" id="fs">Full screen</button>
  <button class="btn" id="hide" title="Hide these controls (press C to bring them back)">Hide controls</button>
</div>
<script>/* Always fetch the latest version of these files, so an update shows at once */ window.GQ_V = Date.now(); document.write(['../js/vendor/qrcode.js', '../js/config.js', 'js/settings.js', 'js/common.js', 'js/backend.js', 'js/results.js', 'js/host.js'].map(f => /\.css$/.test(f) ? `<link rel="stylesheet" href="${f}?v=${GQ_V}">` : `<script src="${f}?v=${GQ_V}"><\/script>`).join(''));</script>
</body>
</html>
