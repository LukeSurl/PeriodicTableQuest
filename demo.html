<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Demo</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 12px 16px; }
  h1 { margin: 0 0 4px; font-size: 1.3rem; }
  p.lead { margin: 0 0 12px; color: var(--muted); max-width: 70ch; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
  .proj { border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: #000; }
  .proj iframe { width: 100%; aspect-ratio: 16 / 9; display: block; border: 0; }
  .phones { display: flex; gap: 12px; }
  .phone { width: 300px; border: 8px solid var(--ink); border-radius: 26px; overflow: hidden; background: var(--bg); }
  .phone iframe { width: 100%; height: 600px; display: block; border: 0; }
  .lbl { font-size: .85rem; font-weight: 600; margin: 0 0 4px; }
  @media (max-width: 1100px) { .stage { grid-template-columns: 1fr; } .phones { flex-wrap: wrap; } .phone { width: min(300px, 100%); } }
</style>
</head>
<body>
<h1>Periodic Table Quest: demo</h1>
<p class="lead">The projector view and two student phones, running in this one page with no server. Press <b>Start</b> on the projector, then answer questions on either phone (or press <b>Simulate class</b>) and watch the table change colour.</p>
<div class="stage">
  <div><p class="lbl">Projector</p><div class="proj"><iframe id="host" src="index.html?demo=1" title="Projector view"></iframe></div></div>
  <div class="phones">
    <div><p class="lbl">Student phone 1</p><div class="phone"><iframe id="p1" title="Phone 1"></iframe></div></div>
    <div><p class="lbl">Student phone 2</p><div class="phone"><iframe id="p2" title="Phone 2"></iframe></div></div>
  </div>
</div>
<script>
  // Relay messages between the frames (the demo's stand-in for a database)
  const frames = ['host', 'p1', 'p2'].map(id => document.getElementById(id));
  window.addEventListener('message', ev => {
    if (!ev.data || !ev.data.__pq) return;
    frames.forEach(f => { if (f.contentWindow && f.contentWindow !== ev.source) f.contentWindow.postMessage(ev.data, '*'); });
  });
  // Load phones after the projector so the demo game exists; give each its own player id
  setTimeout(() => {
    document.getElementById('p1').src = 'play.html?demo=1&g=DEMO&p=1';
    document.getElementById('p2').src = 'play.html?demo=1&g=DEMO&p=2';
  }, 800);
</script>
</body>
</html>
