<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Lecture Quizzes</title>
<script>/* Always fetch the latest version of these files, so an update shows at once */ window.GQ_V = Date.now(); document.write(['../css/style.css', '../grid/css/grid.css', 'plq.css'].map(f => `<link rel="stylesheet" href="${f}?v=${GQ_V}">`).join(''));</script>
</head>
<body class="page plq">
<header class="top"><h1 id="title">Pre-Lecture Quizzes</h1><span class="spacer"></span><span class="small" id="mode"></span></header>
<main>
  <h2 class="first">Create new quiz</h2>
  <div class="products" id="products"></div>
  <p class="small muted" id="createMsg"></p>

  <div class="row savedhead">
    <h2>Your saved quizzes</h2>
    <span class="spacer"></span>
    <div class="filters" id="filters" role="group" aria-label="Show quizzes of type"></div>
  </div>
  <div class="panel"><ul class="qlist-home saved" id="saved"></ul></div>
  <p class="small muted">This list is kept in this browser. To reach a quiz from another computer, open its edit link (Quiz Grid) or present link, which are on the quiz's own page.</p>
</main>
<footer class="about" id="about"></footer>
<script>/* Always fetch the latest version of these files, so an update shows at once */ document.write(['../js/config.js', '../grid/js/settings.js', '../grid/js/common.js', '../grid/js/backend.js', '../js/saved.js', 'settings.js', 'home.js'].map(f => `<script src="${f}?v=${GQ_V}"><\/script>`).join(''));</script>
</body>
</html>
